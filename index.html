<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEL Prompt Framework — Redirecting</title>
  <meta http-equiv="refresh" content="0;url=https://aymanelmasryael.github.io/ael-1000-prompts-library/">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://aymanelmasryael.github.io/ael-1000-prompts-library/">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:radial-gradient(circle at 20% 30%,#030712,#000);color:#eef2ff;font-family:'Inter',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
    .card{background:rgba(5,12,24,.7);border:1px solid rgba(0,116,255,.4);border-radius:1.25rem;padding:3rem;max-width:500px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
    h1{font-size:1.5rem;margin-bottom:1rem;background:linear-gradient(135deg,#fff,#0074FF);-webkit-background-clip:text;background-clip:text;color:transparent}
    p{color:#9ab3e6;margin-bottom:1.5rem;line-height:1.6}
    .loader{width:32px;height:32px;border:3px solid rgba(0,116,255,.2);border-top-color:#0074FF;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1.5rem}
    @keyframes spin{to{transform:rotate(360deg)}}
    a{color:#0074FF;text-decoration:none}
    a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="card">
    <div class="loader"></div>
    <h1>AEL Prompt Framework</h1>
    <p>This content has been merged into the <strong>AEL 1000+ AI Prompts Library</strong> as Batch 11 — 52 professional UI component prompts with enhanced search, export, and generation features.</p>
    <p>You are being redirected automatically...</p>
    <a href="https://aymanelmasryael.github.io/ael-1000-prompts-library/">Click here if not redirected</a>
  </div>
</body>
</html>
