  <text x="295" y="378" fill="#9ab3e6" font-family="sans-serif" font-size="10">Build a reusable virtualized list component in React with TypeScript...</text>

  <rect x="510" y="320" width="240" height="80" rx="12" fill="#0a1628" fill-opacity="0.6" stroke="#0074FF" stroke-opacity="0.25" stroke-width="1" opacity="0.65"/>
